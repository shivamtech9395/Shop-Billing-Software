<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dukaan Manager — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(circle at 15% 15%, rgba(232,163,61,0.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(22,50,79,0.06), transparent 45%),
      var(--paper);
  }
  .login-wrap { width: 100%; max-width: 380px; }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--navy-800); color: var(--amber-500);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px; font-family: var(--font-display); font-weight: 700; font-size: 22px;
  }
  .brand h1 { font-size: 20px; margin: 0 0 4px; color: var(--navy-900); }
  .brand p { color: var(--text-600); font-size: 13.5px; margin: 0; }
  .login-card { padding: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-600); margin-bottom: 6px; }
  .login-card button[type="submit"] { width: 100%; margin-top: 6px; font-size: 15px; padding: 13px; }
  .error-box {
    background: var(--danger-bg); color: var(--danger); font-size: 13px;
    padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 14px; display: none;
  }
  .hint { text-align: center; font-size: 12px; color: var(--text-400); margin-top: 18px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark">DM</div>
      <h1>Dukaan Manager</h1>
      <p>Inventory and Billing, all in one place</p>
    </div>
    <form class="card login-card" id="loginForm">
      <div class="error-box" id="errorBox"></div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Login</button>
    </form>
    <p class="hint">First time here? Admin login: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>

<script src="/static/js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("errorBox");
    const btn = document.getElementById("loginBtn");
    errorBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in...";
    try {
      const data = await API.post("/api/auth/login", {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      });
      localStorage.setItem("token", data.access_token);
      localStorage.setItem("role", data.role);
      localStorage.setItem("name", data.name);
      localStorage.setItem("user_id", data.user_id);
      window.location.href = data.role === "admin" ? "/admin" : "/billing";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Login";
    }
  });

  // If already logged in, skip straight to the right screen.
  (function () {
    const token = API.getToken();
    const role = API.getRole();
    if (token && role) window.location.href = role === "admin" ? "/admin" : "/billing";
  })();
</script>
</body>
</html>
