<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan Manager — My Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { min-height: 100vh; padding-bottom: 76px; }
  .content { padding: 0 18px 20px; max-width: 480px; margin: 0 auto; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }
  .section-head h3 { margin: 0; font-size: 15px; }
  .empty-state { text-align: center; padding: 30px 20px; color: var(--text-400); font-size: 14px; }
  .bill-detail-item { padding: 12px 14px; margin-bottom: 8px; }
  .bill-detail-item .top { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; }
  .bill-detail-item .sub { font-size: 12px; color: var(--text-400); margin-top: 2px; }
</style>
</head>
<body>

<div class="profile-header">
  <div class="profile-avatar" id="avatarInitial">—</div>
  <h2 id="empName">—</h2>
  <div class="role-tag" id="empRole">Employee</div>
</div>

<div class="profile-stat-row">
  <div class="card profile-stat"><div class="label">Today</div><div class="value num" id="statTodaySales">₹0</div></div>
  <div class="card profile-stat"><div class="label">Commission</div><div class="value num" id="statTodayCommission">₹0</div></div>
  <div class="card profile-stat"><div class="label">Bills</div><div class="value num" id="statTodayBills">0</div></div>
</div>

<div class="content">
  <div class="section-head"><h3>Search by Date</h3></div>
  <div class="date-search-row">
    <input type="date" id="searchDate">
    <button class="btn-primary" onclick="searchByDate()">View Bills</button>
    <button class="btn-ghost" onclick="clearSearch()">Clear</button>
  </div>
  <div id="dateResults"></div>

  <div class="section-head"><h3>Recent History (last 30 days)</h3></div>
  <div id="historyList"></div>
  <div class="empty-state" id="historyEmpty" style="display:none">No sales recorded yet.</div>
</div>

<div class="bottom-nav">
  <div class="bottom-nav-item" onclick="location.href='/billing'"><span class="icon">🧾</span>Billing</div>
  <div class="bottom-nav-item active" onclick="location.href='/my-sales'"><span class="icon">📊</span>My Sales</div>
  <div class="bottom-nav-item" onclick="API.logout()"><span class="icon">⏻</span>Logout</div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/my-sales.js"></script>
</body>
</html>
